<header class="sticky top-0 z-50 border-b border-slate-200/70 bg-white/80 backdrop-blur-xl">
  <nav class="mx-auto flex h-18 max-w-7xl items-center justify-between px-5 lg:px-8">
    <!-- Logo -->
    <a routerLink="/" class="flex items-center gap-2.5" (click)="closeMenu()">
      <span
        class="flex size-9 items-center justify-center rounded-xl bg-indigo-600 text-white shadow-sm"
      >
        <lucide-icon [img]="CodeXml" [size]="20" [strokeWidth]="2.2" />
      </span>

      <span class="text-lg font-bold tracking-tight text-slate-900"> DevLearningPlatform </span>
    </a>

    <!-- Desktop Navigation -->
    <div class="hidden items-center gap-8 md:flex">
      <a
        routerLink="/"
        routerLinkActive="text-indigo-600"
        [routerLinkActiveOptions]="{ exact: true }"
        class="text-sm font-medium text-slate-500 transition-colors duration-200 hover:text-indigo-600"
      >
        Home
      </a>

      <a
        routerLink="/courses"
        routerLinkActive="text-indigo-600"
        class="text-sm font-medium text-slate-500 transition-colors duration-200 hover:text-indigo-600"
      >
        Courses
      </a>

      <a
        routerLink="/pricing"
        routerLinkActive="text-indigo-600"
        class="text-sm font-medium text-slate-500 transition-colors duration-200 hover:text-indigo-600"
      >
        Pricing
      </a>
    </div>

    <!-- Desktop Actions -->
    <div class="hidden items-center gap-3 md:flex">
      <a
        routerLink="/login"
        class="rounded-xl px-4 py-2.5 text-sm font-semibold text-slate-600 transition-colors duration-200 hover:bg-indigo-50 hover:text-indigo-600"
      >
        Log in
      </a>

      <a
        routerLink="/register"
        class="rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition-all duration-200 hover:bg-indigo-700 hover:shadow-md"
      >
        Get Started
      </a>
    </div>

    <!-- Mobile Menu Button -->
    <button
      type="button"
      class="flex size-10 items-center justify-center rounded-xl text-slate-600 transition-colors duration-200 hover:bg-indigo-50 hover:text-indigo-600 md:hidden"
      (click)="toggleMenu()"
      [attr.aria-label]="isMenuOpen ? 'Close menu' : 'Open menu'"
    >
      @if (isMenuOpen) {
        <lucide-icon [img]="X" [size]="22" [strokeWidth]="2" />
      } @else {
        <lucide-icon [img]="Menu" [size]="22" [strokeWidth]="2" />
      }
    </button>
  </nav>

  <!-- Mobile Navigation -->
  @if (isMenuOpen) {
    <div class="border-t border-slate-200/70 bg-white/95 px-5 py-5 backdrop-blur-xl md:hidden">
      <div class="mx-auto flex max-w-7xl flex-col gap-1">
        <a
          routerLink="/"
          routerLinkActive="bg-indigo-50 text-indigo-600"
          [routerLinkActiveOptions]="{ exact: true }"
          class="rounded-xl px-4 py-3 text-sm font-medium text-slate-600 transition-colors duration-200 hover:bg-indigo-50 hover:text-indigo-600"
          (click)="closeMenu()"
        >
          Home
        </a>

        <a
          routerLink="/courses"
          routerLinkActive="bg-indigo-50 text-indigo-600"
          class="rounded-xl px-4 py-3 text-sm font-medium text-slate-600 transition-colors duration-200 hover:bg-indigo-50 hover:text-indigo-600"
          (click)="closeMenu()"
        >
          Courses
        </a>

        <a
          routerLink="/pricing"
          routerLinkActive="bg-indigo-50 text-indigo-600"
          class="rounded-xl px-4 py-3 text-sm font-medium text-slate-600 transition-colors duration-200 hover:bg-indigo-50 hover:text-indigo-600"
          (click)="closeMenu()"
        >
          Pricing
        </a>

        <div class="my-3 border-t border-slate-200"></div>

        <a
          routerLink="/login"
          class="rounded-xl px-4 py-3 text-center text-sm font-semibold text-slate-600 transition-colors duration-200 hover:bg-indigo-50 hover:text-indigo-600"
          (click)="closeMenu()"
        >
          Log in
        </a>

        <a
          routerLink="/register"
          class="mt-1 rounded-xl bg-indigo-600 px-4 py-3 text-center text-sm font-semibold text-white shadow-sm transition-all duration-200 hover:bg-indigo-700 hover:shadow-md"
          (click)="closeMenu()"
        >
          Get Started
        </a>
      </div>
    </div>
  }
</header>
