<div class="min-h-screen bg-white lg:grid lg:grid-cols-2">
  <!-- Left side -->
  <section
    class="hidden bg-indigo-600 p-10 lg:flex lg:flex-col lg:justify-between xl:p-14"
  >
    <!-- Brand -->
    <div>
      <a
        routerLink="/"
        class="inline-flex items-center gap-2 text-2xl font-bold tracking-tight text-white"
      >
        <lucide-icon
          [img]="CodeXml"
          class="size-7"
        />
        <span>DevLearn</span>
      </a>
    </div>

    <!-- Main message -->
    <div class="max-w-lg">
      <p
        class="mb-4 text-sm font-semibold uppercase tracking-wider text-indigo-200"
      >
        Learn by building
      </p>

      <h1 class="text-4xl font-bold leading-tight text-white xl:text-5xl">
        Build your skills.
        <br />
        Build your future.
      </h1>

      <p class="mt-6 max-w-md text-base leading-7 text-indigo-100">
        Learn development through practical courses, hands-on lessons,
        and real coding practice.
      </p>

      <!-- Features -->
      <div class="mt-8 space-y-4 text-sm text-indigo-100">
        <div class="flex items-center gap-3">
          <lucide-icon
            [img]="CodeXml"
            class="size-5 text-indigo-200"
          />
          <span>Learn through practical coding</span>
        </div>

        <div class="flex items-center gap-3">
          <lucide-icon
            [img]="LaptopMinimalCheck"
            class="size-5 text-indigo-200"
          />
          <span>Practice what you learn</span>
        </div>

        <div class="flex items-center gap-3">
          <lucide-icon
            [img]="Rocket"
            class="size-5 text-indigo-200"
          />
          <span>Grow as a developer</span>

          <lucide-icon
            [img]="ArrowRight"
            class="size-4 text-indigo-200"
          />
        </div>
      </div>
    </div>

    <!-- Copyright -->
    <p class="text-sm text-indigo-200">
      © 2026 DevLearn
    </p>
  </section>

  <!-- Right side -->
  <main
    class="flex min-h-screen items-center justify-center px-5 py-12 sm:px-8 lg:px-12"
  >
    <div class="w-full max-w-md">
      <router-outlet />
    </div>
  </main>
</div>
